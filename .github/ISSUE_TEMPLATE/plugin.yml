name: Platform or integration request
description: A surface, an account provider, or a tool the runtime should support
labels: [plugin]
body:
  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options: [platform, provider, tool]
    validations:
      required: true
  - type: input
    id: name
    attributes:
      label: Name
      placeholder: slack, trello, canvas
    validations:
      required: true
  - type: textarea
    id: stories
    attributes:
      label: What it would be used for
      description: Two or three real requests, the tool call each becomes, and which of them change or delete data.
    validations:
      required: true
