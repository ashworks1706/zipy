[project]
name = "testbed"
version = "0.1.0"
description = "The offline half: datasets, curation, post-training and experiments over what a deployment produced"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "pyyaml>=6",
    "rich>=13",
    "typer>=0.15",
]

# Post-training only. The gate never installs these, and nothing outside posttrain imports them.
[project.optional-dependencies]
gpu = [
    "datasets>=3.0",
    "torch>=2.5",
    "transformers>=4.47",
    "trl>=0.12",
    "unsloth>=2024.12",
]

[project.scripts]
data = "testbed.datasets.cli:app"
train = "testbed.posttrain.cli:app"

[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "testbed" = "." }
packages = ["testbed", "testbed.core", "testbed.datasets", "testbed.posttrain"]
