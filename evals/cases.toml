# The eval cases. Each id is a story in docs/USER_STORIES.md, and the two files move together.
#
# calls are the qualified tool actions the run must make. contains is what the answer must carry,
# taken from evals/fixtures.toml, so a run that invents an answer fails rather than reading well.
# confirms is whether the run must stop before changing anything, which the action type decides
# and the model does not.
#
# The cases are scored on two axes that are never added together: correctness is what is here,
# behaviour is measured from the same run. See apps/engine/evals/scoring.py.

# ---------------------------------------------------------------- calendar

[[case]]
id = "calendar-next-meeting"
ask = "When's the next exec board meeting?"
calls = ["calendar.list_events"]
contains = ["CPCOM 210"]

[[case]]
id = "calendar-create-event"
ask = """
Add an event to calendar inviting me and sarah@asu.edu, a workshop on intro to LLMs, next Tuesday
6pm, room CPCOM 210.
"""
calls = ["calendar.create_event"]
contains = ["calendar.example/ev-9"]

[[case]]
id = "calendar-respace-week"
ask = "Can you readjust events this week? I want them to have 5-hour gaps between them."
calls = ["calendar.list_events", "calendar.update_event"]
confirms = true

[[case]]
id = "calendar-free-slots"
ask = "Am I free Thursday between 2 and 5?"
calls = ["calendar.suggest_time"]

# ---------------------------------------------------------------- notion

[[case]]
id = "notion-next-deadline"
ask = "When do I have to submit the next budget request?"
