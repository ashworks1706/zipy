# ---------------------------------------------------------------- cross-tool

[[case]]
id = "cross-week-digest"
ask = "What's happening this week?"
calls = ["calendar.list_events", "notion.query_database"]

[[case]]
id = "cross-meeting-rundown"
ask = """
Prepare me a rundown for tomorrow's exec meeting: what's on the agenda, what tasks are due, and
any notes from last week's meeting.
"""
calls = ["calendar.list_events", "notion.query_database"]

# ---------------------------------------------------------------- the contrast
#
# The same case at both ends of one dimension. Correctness must hold, because a preference is not
# a permission and never changes what is true; behaviour must move, because a state that changes
# nothing is a state not worth keeping. This is what decides whether collaboration.enabled ships
# on, and it is read per case, not averaged.

[[contrast]]
case = "calendar-next-meeting"
dimension = "depth"

[[contrast]]
case = "notion-task-status"
dimension = "depth"

[[contrast]]
case = "calendar-respace-week"
dimension = "autonomy"
