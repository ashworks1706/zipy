[[case]]
id = "notion-assign-todo"
ask = "Add Ben to the sponsorship outreach todo. I need to work with him on it."
calls = ["notion.update_page"]
confirms = true

[[case]]
id = "notion-task-status"
ask = "What's the status of our event planning tasks?"
