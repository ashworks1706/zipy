# What the tools answer during an eval, instead of reaching Google, Notion or Zoom.
#
# One table per qualified action, validated into the result model the plugin declares, so a
# fixture that stops fitting the schema fails the run. The fixture does not look at the params: an
# action answers the same thing however it was called, and what the case scores is whether the
# right action ran and whether the answer carried what the fixture holds.

[org]
name = "Robotics Club"

[[org.facts]]
key = "budget tracker"
category = "tool_mapping"
value = "the Notion database called Finance Tracker"

[[org.facts]]
key = "exec board meeting"
value = "Wednesdays at 6pm in CPCOM 210"

