# Zipy configuration. Every tunable value lives here at its default, committed.
#
# ZIPY_<TABLE>__<KEY> from the environment wins over this file (ZIPY_PLATFORMS__DISCORD__TOKEN
# reaches [platforms.discord]); ZIPY_CONFIG_FILE points at another one. Secrets and per-machine
# URLs live in .env (see .env.example), never here. A bad combination is rejected at load.
# Per-org overrides of [tools.*] settings live in Postgres and are set from chat; orgs never edit
# this file.
#
# Three plugin kinds are configured here, each one table per folder under apps/engine:
#   [platforms.*]  chat platforms Zipy lives on          apps/engine/platforms/<name>
#   [providers.*]  account types an org connects        apps/engine/auth/providers/<name>
#   [tools.*]      what the model can call               apps/engine/tools/<name>
# A folder without a table, or a table without a folder, fails at startup.

# Bumped only when a table changes shape so an older file would be misread.
config_version = 1

[app]
# dev prints readable logs; prod prints JSON lines.
env = "dev"
name = "Zipy"

[api]
# OAuth callbacks, provider webhooks and platform event routes, in the same event loop.
host = "127.0.0.1"
port = 8080

[agent]
# Tool-calling turns before the loop stops and says so.
max_iterations = 8
# Seconds a destructive action waits for a confirm click.
confirmation_ttl_secs = 120
# The Jinja2 template for the system prompt, under apps/engine/agent/templates.
system_template = "system.md.j2"
# Images of one message sent to the model. The model has to be one that reads images; see
# deploy/inference/README.md. 0 sends none.
max_images = 4

# ---------------------------------------------------------------- models
#
# One table per job the engine gives a model, each any LiteLLM model string. Change provider or
# model here; keys live in .env as ZIPY_MODELS__<ROLE>__API_KEY. fallbacks are tried in order.
#
# The defaults are the llama-server that just model starts, so a fresh clone answers with no
# hosted account. api_base is what selects it; set ZIPY_MODELS__<ROLE>__API_BASE and
# ZIPY_MODELS__<ROLE>__API_KEY in .env to send a role to a hosted provider instead, and
# ZIPY_MODELS__<ROLE>__MODEL to name its model. See deploy/inference/README.md.
# api_key is not a secret here: llama-server accepts any string and the OpenAI-compatible
# client requires one.

[models.chat]
# Runs the tool-calling loop.
#
# Three tiers, all OpenAI-compatible, so only these keys change between them:
#   hosted    a provider API                     conditioning = "text"
#   local     llama.cpp, just model              conditioning = "text"
#   local+    vLLM or SGLang                     conditioning = "prefix", once one is built
#
# conditioning says what this endpoint can be conditioned with. Every endpoint takes tokens, so
# text works on all three. A prefix in embedding space needs a server that accepts input
# embeddings, which only the third tier does. A conditioning with no renderer is refused at boot.
model = "openai/zipy-chat"
api_base = "http://127.0.0.1:8000/v1"
api_key = "local"
fallbacks = []
conditioning = "text"
temperature = 0.2
max_tokens = 1024
timeout_secs = 120.0

[models.summary]
# Condenses transcripts and long tool results. The same server as chat; one model is loaded.
model = "openai/zipy-chat"
api_base = "http://127.0.0.1:8000/v1"
api_key = "local"
fallbacks = []
temperature = 0.1
max_tokens = 1024
timeout_secs = 180.0

[models.embedding]
# Feeds semantic recall. dimensions must match data/tables.py EMBEDDING_DIMENSIONS; a change is
# a migration and a re-embed.
model = "openai/zipy-embed"
api_base = "http://127.0.0.1:8001/v1"
api_key = "local"
dimensions = 1024

# Per-person collaboration state: scores read from how someone works, conditioning the answers
# they get. Direction, not shipped; see docs/ROADMAP.md v0.7. Off means every prompt is exactly
# what it would be without it. The state holds scores and a count, never conversation text.
[collaboration]
enabled = false
# Weight of one observation in the moving average.
alpha = 0.15
# Observations before the state says anything to the model at all.
min_observations = 5
# A turn right after an answer is read for what it asks for. The category is kept, never the
# words. A turn that reads as a correction raises only that; a turn that reads as two things at
# once raises nothing.
brevity_triggers = [
    "just tell me",
    "too long",
    "shorter",
    "tldr",
    "tl;dr",
    "get to the point",
    "in one line",
    "skip the explanation",
]
detail_triggers = [
    "why",
    "explain",
    "how did you",
    "walk me through",
    "more detail",
    "elaborate",
    "what did you check",
]
correction_triggers = [
    "no,",
    "not what i",
    "i meant",
    "that's wrong",
    "thats wrong",
    "you should have asked",
    "undo",
    "revert that",
]

[memory]
# The last N messages of the conversation, read from the platform, given to the model.
conversation_limit = 20
# Semantic recall runs only when the message contains one of these phrases.
recall_triggers = [
    "last meeting",
    "previous",
    "previously",
    "what did we decide",
    "summarize",
    "summary of",
    "last week",
    "last month",
]
recall_top_k = 5
recall_min_similarity = 0.72
chunk_tokens = 500
chunk_overlap_tokens = 50

[memory.retention_days]
# Days a tool's documents are kept, by tool name. A tool not listed keeps them until re-synced.
zoom = 180
notion = 365
drive = 365

[budget]
# The default monthly LLM spend per org, in cents. An org at its budget gets no LLM calls.
monthly_cents = 200

[rate_limit]
# Messages per member per minute, per org.
per_member_per_minute = 10
# Longest a tool call waits for an outbound call to come under the limit before it fails.
# A worker sync waits as long as it needs to.
provider_max_wait_seconds = 5.0

# Outbound calls to one provider, per org. Applies to model-driven tool calls and to the
# document syncs the workers run, so one org's backlog cannot spend another org's quota.
[rate_limit.provider]
per_minute = 60
burst = 10

# Per-provider overrides, keyed by the name of a [providers.*] table. A provider with no entry
# uses [rate_limit.provider].
[rate_limit.providers]

[workers]
token_refresh_minutes = 45
# A token expiring within this window is refreshed.
token_refresh_window_minutes = 60
cleanup_hour_utc = 4

[permissions]
# The action types each role may run. Per-org overrides live in Postgres.
admin = ["read", "create", "destructive"]
officer = ["read", "create", "destructive"]
member = ["read"]

[telemetry]
# Sentry DSN and LangFuse keys live in .env; empty sends nothing.
service_name = "zipy"
# JSON log lines instead of readable ones. The prod image sets ZIPY_TELEMETRY__LOG_JSON=true.
log_json = false
# One JSONL file per request, under <trace_dir>/<org_id>/<request_id>.jsonl; empty writes none.
trace_dir = ".zipy/traces"
# Serve Prometheus metrics at /metrics on the API.
metrics = true
sentry_traces_sample_rate = 0.1

# ---------------------------------------------------------------- files
#
# Files attached to a message are downloaded, read into text, and stored as documents of source
# upload, so the same file answers this turn and every later question about it. Parsing runs in
# this process under a deadline; a file nothing reads is named and left rather than guessed at.

[files]
enabled = true
max_per_message = 5
max_bytes = 20000000
# Characters one file yields into the document store.
max_chars = 200000
# Characters of it that go into this turn's prompt. The rest stays searchable.
max_prompt_chars = 8000
download_timeout_secs = 30.0
parse_timeout_secs = 30.0

# ---------------------------------------------------------------- training
#
# Datasets built from the traces above. The decisions a reviewer makes are the one part of this
# that is in source control: an export can be run again, a judgment cannot.

[training]
# Generated data: the raw export, the verified set, the curated set, and training outputs.
data_dir = ".zipy/training"
# The review decisions, committed.
decisions_path = "apps/training/curation/decisions.jsonl"
# Skip traces older than this on export. Zero reads every one.
max_age_days = 0

# ---------------------------------------------------------------- platforms
#
# Chat platforms. Each renders its own formatting and message limit; the gateway fits replies to
# them. Tokens and signing secrets live in .env as ZIPY_PLATFORMS__<NAME>__<KEY>.

# Off until a token is set: an enabled platform with no credential stops the whole process, and
# a clone has no token. Turn it on here or with ZIPY_PLATFORMS__DISCORD__ENABLED=true.
[platforms.discord]
enabled = false
message_limit = 2000
# Shortest gap between edits of the one message a turn is written into. Discord rate limits
# edits, so a shorter gap is not a faster card.
edit_every_ms = 1500

[platforms.slack]
enabled = false
message_limit = 3000

# A terminal conversation for development, and the one platform a clone can use before any
# credential exists. zipy chat runs it whether or not it is enabled here.
[platforms.local]
enabled = true
org_name = "Local dev org"
member_name = "developer"

# ---------------------------------------------------------------- providers
#
# Accounts an org connects once, shared by every tool that names the provider. Client ids and
# secrets live in .env as ZIPY_PROVIDERS__<NAME>__CLIENT_ID and __CLIENT_SECRET.

[providers.google]
enabled = true

[providers.notion]
enabled = true

[providers.zoom]
enabled = true

[providers.github]
enabled = true

# ---------------------------------------------------------------- tools
#
# Each action names its type, which decides whether it runs at once (read, create) or waits for a
# confirmation (destructive). The model never decides this. A tool is offered to the model only
# when its provider is connected and the org has it enabled. A tool that syncs documents for
# recall has sync_hours.

[tools.calendar]
provider = "google"
enabled = true
scopes = ["https://www.googleapis.com/auth/calendar"]
default_event_minutes = 60
default_reminder_minutes = 10

[tools.calendar.actions]
list_events = "read"
find_free_slots = "read"
create_event = "create"
update_event = "destructive"
delete_event = "destructive"

[tools.drive]
provider = "google"
enabled = true
scopes = ["https://www.googleapis.com/auth/drive.readonly"]
max_results = 10
sync_hours = 12

[tools.drive.actions]
search_files = "read"
list_folder = "read"

[tools.notion]
provider = "notion"
enabled = true
scopes = []
max_results = 25
sync_hours = 6

[tools.notion.actions]
query_database = "read"
get_page = "read"
create_page = "create"
update_page = "destructive"

[tools.zoom]
provider = "zoom"
enabled = true
scopes = ["cloud_recording:read"]

[tools.zoom.actions]
list_recordings = "read"
latest_summary = "read"

[tools.github]
provider = "github"
enabled = true
# repo covers reading private repositories and opening issues; read:org resolves the org's
# members. Drop repo to public_repo when the org has no private repository worth reading.
scopes = ["repo", "read:org"]
# Owner an unqualified repo name is read under. Empty means every repo must be given as owner/name.
default_owner = ""
max_results = 25

[tools.github.actions]
list_issues = "read"
get_issue = "read"
search_issues = "read"
get_file = "read"
create_issue = "create"
comment = "create"

[tools.search]
# Web and campus portal search. Needs no connected account.
enabled = true
scopes = []
campus_portal_url = "https://asu.campuslabs.com/engage/organizations"
max_results = 5

[tools.search.actions]
web_search = "read"
campus_orgs = "read"

# ---------------------------------------------------------------- developer console (apps/cli)

[console]
# Every line a unit prints is also appended to <log_dir>/<unit>.log.
log_dir = ".zipy/logs"
# Play the logo animation from apps/cli/assets on start; any key skips it.
splash = true
log_lines = 5000
status_interval_secs = 5.0
metrics_interval_secs = 2.0
